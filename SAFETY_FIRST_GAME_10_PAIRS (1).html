<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFETY FIRST GAME NEW!</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#061923,#07506a,#0b2733);color:#fff}
.wrap{max-width:1050px;margin:auto;padding:20px}
header{text-align:center}
h1{font-size:clamp(28px,5vw,48px);margin:5px 0}
.sub{font-size:clamp(14px,2vw,19px);color:#d8f5ff}
.stats{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:18px auto}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:15px;padding:9px 20px;text-align:center;min-width:120px}
.stat small{display:block;color:#bfe8f8}.stat b{font-size:25px}
button{border:0;border-radius:12px;padding:12px 18px;font-weight:bold;font-size:16px;background:#ffd21f;color:#17232a;cursor:pointer}
button:hover{transform:translateY(-1px)}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;max-width:850px;margin:20px auto}
.card{aspect-ratio:1/1;perspective:900px;cursor:pointer;transition:opacity .3s,transform .3s}
.card.removing{opacity:0;transform:scale(.7);pointer-events:none}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 6px 14px #0006}
.back{background:linear-gradient(145deg,#087d9e,#063e5c);font-size:45px;border:2px solid #8deaff}
.front{transform:rotateY(180deg);background:#fff;color:#10212d;flex-direction:column;gap:7px;padding:8px;border:3px solid #ffd21f}
.icon{font-size:clamp(40px,6vw,68px);line-height:1}
.name{font-weight:bold;font-size:clamp(11px,1.4vw,16px)}
.hint{text-align:center;color:#bfe8f8;margin:12px}
.overlay{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px;z-index:10}
.result{background:white;color:#12232b;border-radius:24px;max-width:520px;width:100%;padding:30px;text-align:center}
.result h2{font-size:34px;margin:0 0 10px}.trophy{font-size:60px}
.score{font-size:48px;font-weight:bold;margin:8px}
.result p{font-size:18px;margin:8px}
@media(max-width:700px){#board{grid-template-columns:repeat(4,1fr);gap:8px}.wrap{padding:12px}.stat{min-width:100px;padding:8px}.stat b{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🦺 SAFETY FIRST GAME NEW!</h1>
<div class="sub">เกมจับคู่ป้ายสัญลักษณ์ความปลอดภัยในการทำงาน</div>
</header>

<div class="stats">
<div class="stat"><small>เวลา</small><b id="timer">00:00</b></div>
<div class="stat"><small>จับคู่สำเร็จ</small><b><span id="pairs">0</span> / 10</b></div>
<div class="stat"><small>เปิดไพ่</small><b id="moves">0</b></div>
<button id="start" onclick="startGame()">▶ เริ่มเกม</button>
<button onclick="resetGame()">↻ เริ่มใหม่</button>
</div>

<div id="board"></div>
<div class="hint">เปิดไพ่ทีละ 2 ใบ • จับคู่ให้ครบ 10 คู่ • จับถูกไพ่จะหายไป</div>
</div>

<div class="overlay" id="overlay">
<div class="result">
<div class="trophy">🏆</div>
<h2>จบเกม!</h2>
<p>จับคู่ครบทั้ง 10 คู่แล้ว</p>
<div class="score" id="finalScore">100 คะแนน</div>
<p>⏱️ เวลา: <b id="finalTime">00:00</b></p>
<p>🃏 จำนวนครั้งที่เปิด: <b id="finalMoves">0</b> ครั้ง</p>
<p id="message"></p>
<button onclick="playAgain()">▶ เล่นอีกครั้ง</button>
</div>
</div>

<script>
const symbols=[
["หมวกนิรภัย","🪖"],
["แว่นตานิรภัย","🥽"],
["อุปกรณ์ป้องกันเสียง","🎧"],
["ถุงมือนิรภัย","🧤"],
["รองเท้านิรภัย","🥾"],
["ห้ามสูบบุหรี่","🚭"],
["อันตรายจากไฟฟ้า","⚡"],
["วัตถุไวไฟ","🔥"],
["ถังดับเพลิง","🧯"],
["ทางหนีไฟ","🚪"]
];

let deck=[],first=null,second=null,lock=false,pairs=0,moves=0,seconds=0,timer=null,started=false;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function build(){
 deck=[];
 symbols.forEach((s,i)=>{
  deck.push({id:i,name:s[0],icon:s[1]},{id:i,name:s[0],icon:s[1]});
 });
 shuffle(deck);
 const board=document.getElementById("board");board.innerHTML="";
 deck.forEach((c,i)=>{
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`<div class="inner"><div class="face back">⚠️</div><div class="face front"><div class="icon">${c.icon}</div><div class="name">${c.name}</div></div></div>`;
  card.onclick=()=>flip(card,i);board.appendChild(card);
 });
}
function startGame(){
 if(started)return;
 started=true;document.getElementById("start").textContent="⏱️ กำลังเล่น";
 timer=setInterval(()=>{seconds++;document.getElementById("timer").textContent=time(seconds)},1000);
}
function flip(card,i){
 if(!started)startGame();
 if(lock||card.classList.contains("open")||card.classList.contains("removing"))return;
 card.classList.add("open");
 if(!first){first={card,i};return}
 second={card,i};moves++;document.getElementById("moves").textContent=moves;lock=true;
 const match=deck[first.i].id===deck[second.i].id;
 setTimeout(()=>{
  if(match){
   first.card.classList.add("removing");second.card.classList.add("removing");
   pairs++;document.getElementById("pairs").textContent=pairs;
   if(pairs===10)finish();
  }else{
   first.card.classList.remove("open");second.card.classList.remove("open");
  }
  first=null;second=null;lock=false;
 },match?450:850);
}
function finish(){
 clearInterval(timer);timer=null;started=false;
 let score=Math.max(0,1000-(seconds*3)-((moves-10)*10));
 score=Math.round(score);
 document.getElementById("finalScore").textContent=score+" คะแนน";
 document.getElementById("finalTime").textContent=time(seconds);
 document.getElementById("finalMoves").textContent=moves;
 document.getElementById("message").textContent=score>=800?"🌟 ทำได้ยอดเยี่ยม!":score>=600?"👏 ทำได้ดีมาก!":"💪 เยี่ยมมาก! ความปลอดภัยสำคัญกว่าความเร็ว";
 setTimeout(()=>document.getElementById("overlay").style.display="flex",500);
}
function resetGame(){
 clearInterval(timer);timer=null;started=false;seconds=0;pairs=0;moves=0;first=null;second=null;lock=false;
 document.getElementById("timer").textContent="00:00";document.getElementById("pairs").textContent="0";document.getElementById("moves").textContent="0";
 document.getElementById("start").textContent="▶ เริ่มเกม";document.getElementById("overlay").style.display="none";build();
}
function playAgain(){document.getElementById("overlay").style.display="none";resetGame();startGame()}
function time(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
resetGame();
</script>
</body>
</html>
